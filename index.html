<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리의 결혼 준비</title>
<style>
:root{--bg:#f7f5f3;--card:#fff;--ink:#2d2926;--muted:#8b817b;--line:#e9e2de;--accent:#b78f83;--soft:#f1e8e4;--danger:#b45d5d}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px}
.app{max-width:720px;margin:auto;min-height:100vh;padding:14px 12px 88px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin-bottom:12px}.top h1{font-size:19px;margin:0}.pill{background:var(--soft);padding:6px 9px;border-radius:99px;font-size:11px}.muted{color:var(--muted);font-size:12px}.big{font-size:24px;font-weight:800}.money{font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:11px;box-shadow:0 4px 14px #4933260a}
h2{font-size:17px;margin:5px 2px 11px}.btn{border:0;background:var(--ink);color:#fff;border-radius:11px;padding:9px 12px;font-weight:700}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.danger{background:#f8eaea;color:var(--danger)}.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;font-size:11px;color:var(--ink)}.mini.danger{color:var(--danger)}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calhead button{border:0;background:none;font-size:22px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{font-size:11px;color:var(--muted);margin-bottom:4px}.day{min-height:46px;padding:7px 2px;border-radius:11px;position:relative;cursor:pointer}.day.today{background:var(--soft);font-weight:800}.day.sel{outline:2px solid var(--accent)}.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:5px;left:50%}
.task{padding:11px 2px;border-bottom:1px solid var(--line)}.task:last-child{border:0}.status{border:0;border-radius:9px;padding:7px;background:var(--soft)}
.month{overflow:hidden;padding:0}.monthTitle{padding:14px 15px;cursor:pointer;font-weight:800}.monthBody{padding:0 15px 8px}.itemline{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}.detail{grid-column:1/-1;background:#faf8f7;border-radius:11px;padding:11px;margin-top:3px;font-size:13px;line-height:1.7}.detailActions{display:flex;gap:6px;margin-top:8px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font:inherit;min-height:42px}textarea{min-height:70px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 4px}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;z-index:30}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:21px 21px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom))}.sheet h2{font-size:19px;margin:2px 0 10px}.actions{display:flex;gap:8px;margin-top:13px}.actions>*{flex:1}
.manageRow{display:grid;grid-template-columns:1fr auto;gap:7px}.manager{display:none;margin-top:8px;background:#faf8f7;border:1px solid var(--line);border-radius:12px;padding:10px}.manager.on{display:block}.managerAdd{display:grid;grid-template-columns:1fr auto;gap:7px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.tag{display:flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 9px;font-size:12px}.tag button{border:0;background:none;padding:1px 3px;color:var(--muted)}
.budgetGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#faf8f7;border-radius:14px;padding:12px}.stat.full{grid-column:1/-1}.progress{height:7px;background:#eee8e5;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--accent)}
.budgetCats{display:grid;gap:5px}.budgetCat{background:#faf8f7;border:1px solid var(--line);border-radius:11px;padding:6px 8px;cursor:pointer}.budgetCat.open{padding-bottom:8px}.budgetCatDetail{display:none;margin-top:6px;border-top:1px solid var(--line);padding-top:5px}.budgetCat.open .budgetCatDetail{display:block}.budgetDetailRow{display:grid;grid-template-columns:48px 1fr auto;gap:6px;align-items:center;padding:5px 0;font-size:11px}.budgetDetailRow+.budgetDetailRow{border-top:1px dashed #eee7e3}.budgetDetailMeta{color:var(--muted);font-size:9px;margin-top:1px}.budgetDetailActions{display:flex;gap:3px;margin-left:4px}.budgetCatTop,.accountTop{display:flex;justify-content:space-between;align-items:center;gap:6px}.budgetCatNums{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px}.budgetNum{background:#fff;border-radius:9px;padding:5px 7px}.budgetNum small{display:block;color:var(--muted);font-size:9px;margin-bottom:1px}.budgetTotalPaid{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:7px;margin-top:7px;font-weight:800;font-size:12px}
.accountCard{padding:11px 0;border-bottom:1px solid var(--line)}.accountCard:last-child{border-bottom:0}.accountActions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.sumRow{display:flex;justify-content:space-between;padding-top:11px;margin-top:5px;border-top:1px solid var(--line);font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fffc;border-top:1px solid var(--line);backdrop-filter:blur(15px);display:flex;justify-content:center;z-index:20}.navin{width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;padding:8px;font-weight:700;color:var(--muted)}.nav button.on{color:var(--ink)}
.page{display:none}.page.on{display:block}.empty{text-align:center;color:var(--muted);padding:20px 4px}
@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.card{padding:12px}.itemline{grid-template-columns:52px 1fr auto}.budgetCats{gap:4px}.budgetCat{padding:5px 7px}.budgetCatNums{gap:4px;margin-top:3px}.budgetNum{padding:4px 6px}}
.clickableStat{cursor:pointer}.clickableStat:active{transform:scale(.99)}.allExpensePanel{padding-top:12px}.allExpenseRow{display:grid;grid-template-columns:54px 1fr auto;gap:7px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.allExpenseRow:first-child{border-top:0}.allExpenseTitle{font-weight:800;font-size:12px}.allExpenseMeta{font-size:10px;color:var(--muted);margin-top:2px}.allExpenseAmount{font-weight:800;font-size:12px;white-space:nowrap}.compactDateTime{width:62%;max-width:320px;min-width:210px;margin:0 auto;display:block;text-align:center}
@media(max-width:430px){.compactDateTime{width:58%;max-width:none;min-width:0}}

.authGate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.authCard{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 10px 30px #49332612}
.authIcon{font-size:42px;margin-bottom:6px}.authCard h1{font-size:22px;margin:4px 0 8px}.authCard p{color:var(--muted);font-size:13px;margin:0 0 18px}
.googleBtn{width:100%;border:0;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px}
.authError{color:var(--danger);font-size:12px;line-height:1.5;margin-top:10px;min-height:18px}
.authBar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 10px;margin-bottom:10px}
.authEmail{font-size:11px;font-weight:800;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.authUid{font-size:8px;color:var(--muted);margin-top:2px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.authBtns{display:flex;gap:4px;flex-shrink:0}.syncStatus{font-size:9px;color:var(--accent);margin-top:2px}

</style>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="authGate" class="authGate">
  <div class="authCard">
    <div class="authIcon">💍</div>
    <h1>우리의 결혼 준비</h1>
    <p>공유 Google 계정으로 로그인해 주세요.</p>
    <button class="googleBtn" onclick="googleLogin()">Google로 로그인</button>
    <div id="authError" class="authError"></div>
  </div>
</div>
<main class="app" id="appRoot" style="display:none">

<div class="authBar" id="authBar">
  <div>
    <div class="authEmail" id="authEmail"></div>
    <div class="authUid">UID <span id="authUid"></span></div>
<div class="syncStatus" id="syncStatus">동기화 준비 중</div>
  </div>
  <div class="authBtns">
    <button class="mini" onclick="copyUid()">UID 복사</button>
    <button class="mini" onclick="logout()">로그아웃</button>
  </div>
</div>

<section id="home" class="page on">
  <div class="top"><h1>💍 우리의 결혼 준비</h1><span class="pill">Wedding Planner</span></div>
  <div class="card"><div class="calhead"><button onclick="moveMonth(-1)">‹</button><b id="calTitle"></b><button onclick="moveMonth(1)">›</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="days"></div></div>
  <div id="selectedBox" class="card" style="display:none"></div>
  <h2>📌 진행 중</h2><div class="card" id="ongoing"></div>
</section>

<section id="schedule" class="page">
  <div class="top"><h1>📋 결혼 준비 일정</h1><button class="btn" onclick="openTask()">+ 추가</button></div>
  <div id="months"></div>
</section>

<section id="money" class="page">
  <div class="top"><h1>💰 결혼 가계부</h1><button class="btn ghost" onclick="editTotalBudget()">총예산 수정</button></div>
  <div class="card budgetGrid">
    <div class="stat full"><div class="muted">총 예산</div><div class="big" id="budgetTotal">0원</div><div class="progress"><i id="budgetBar"></i></div></div>
    <div class="stat clickableStat" onclick="toggleAllExpenses()">
  <div class="muted">총 결제금액</div>
  <div class="money" id="spent">0원</div>
  <div class="muted" style="margin-top:4px">눌러서 전체 내역 보기</div>
</div>
    <div class="stat"><div class="muted">남은 총 예산</div><div class="money" id="remaining">0원</div></div>
  </div>
  <div class="card allExpensePanel" id="allExpensePanel" style="display:none">
    <div class="row"><h2 style="margin:0">전체 결제내역</h2><button class="mini" onclick="toggleAllExpenses()">닫기</button></div>
    <div id="allExpenseList"></div>
  </div>

  <div class="row"><h2>📊 항목별 예산 · 결제</h2><button class="btn ghost" onclick="openMoneyCategoryManager()">분류 관리</button></div>
  <div class="card"><div class="budgetCats" id="budgetCats"></div></div>

  <div class="row"><h2>🏦 우리 계좌</h2><button class="btn" onclick="openAccount()">+ 통장 추가</button></div>
  <div class="card"><div id="accounts"></div><div class="sumRow"><span>총 보유금액</span><span id="accountTotal">0원</span></div><button class="btn ghost" style="width:100%;margin-top:11px" onclick="openTransfer()">통장 간 이체</button></div>

  <div class="row"><h2>💳 결제 내역</h2><button class="btn" onclick="openExpense()">+ 추가</button></div>
  <div id="expenses"></div>
</section>
</main>

<nav class="nav" id="appNav" style="display:none"><div class="navin">
<button class="on" onclick="showPage('home',this)">🏠<br>홈</button>
<button onclick="showPage('schedule',this)">📋<br>일정</button>
<button onclick="showPage('money',this)">💰<br>가계부</button>
</div></nav>

<!-- 일정 -->
<div class="modal" id="taskModal"><div class="sheet">
<h2 id="taskModalTitle">일정 추가</h2>
<label>제목</label><input id="tTitle">
<label>날짜</label><input type="date" id="tDate" class="compactDateTime">
<label>시간 (선택)</label><input type="time" id="tTime" class="compactDateTime">
<label>카테고리</label><div class="manageRow"><select id="tCat"></select><button class="btn ghost" type="button" onclick="toggleScheduleCategoryManager()">관리</button></div>
<div class="manager" id="scheduleCategoryManager"><div class="managerAdd"><input id="newScheduleCat" placeholder="새 카테고리"><button class="btn" onclick="addScheduleCategory()">추가</button></div><div class="tags" id="scheduleCatTags"></div></div>
<label>상태</label><select id="tStatus"><option>선택</option><option>진행중</option><option>완료</option></select>
<label>메모 (선택)</label><textarea id="tMemo"></textarea>
<div class="actions"><button class="btn ghost" onclick="closeM('taskModal')">취소</button><button class="btn" id="taskSaveBtn" onclick="saveTask()">저장</button></div>
</div></div>

<!-- 가계부 분류 관리 -->
<div class="modal" id="moneyCatModal"><div class="sheet">
<h2>가계부 분류 관리</h2>
<div class="managerAdd"><input id="newMoneyCat" placeholder="새 분류"><button class="btn" onclick="addMoneyCategory()">추가</button></div>
<div id="moneyCatList" style="margin-top:10px"></div>
<div class="actions"><button class="btn" onclick="closeM('moneyCatModal')">닫기</button></div>
</div></div>

<!-- 계좌 -->
<div class="modal" id="accountModal"><div class="sheet">
<h2 id="accountModalTitle">통장 추가</h2>
<label>통장 이름</label><input id="aName" placeholder="예: 결혼 저축통장">
<label>현재 잔액</label><input type="number" id="aBalance" inputmode="numeric">
<div class="actions"><button class="btn ghost" onclick="closeM('accountModal')">취소</button><button class="btn" id="accountSaveBtn" onclick="saveAccount()">저장</button></div>
</div></div>

<!-- 이체 -->
<div class="modal" id="transferModal"><div class="sheet">
<h2>통장 간 이체</h2>
<label>보내는 통장</label><select id="trFrom"></select>
<label>받는 통장</label><select id="trTo"></select>
<label>금액</label><input type="number" id="trAmount" inputmode="numeric">
<div class="actions"><button class="btn ghost" onclick="closeM('transferModal')">취소</button><button class="btn" onclick="saveTransfer()">이체</button></div>
</div></div>

<!-- 결제 -->
<div class="modal" id="expenseModal"><div class="sheet">
<h2 id="expenseModalTitle">결제 추가</h2>
<label>항목명</label><input id="eTitle">
<label>카테고리</label><select id="eCat"></select>
<label>날짜</label><input type="date" id="eDate">
<label>금액</label><input type="number" id="eAmount" inputmode="numeric">
<label>결제수단</label><select id="eSource"></select>
<label>메모 (선택)</label><textarea id="eMemo"></textarea>
<div class="actions"><button class="btn ghost" onclick="closeM('expenseModal')">취소</button><button class="btn" id="expenseSaveBtn" onclick="saveExpense()">저장</button></div>
</div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDwyI-FGM9x08f2qZ0i2QPy3iSqqCh0Des",
  authDomain: "wedding-plan-56c07.firebaseapp.com",
  projectId: "wedding-plan-56c07",
  storageBucket: "wedding-plan-56c07.firebasestorage.app",
  messagingSenderId: "803082075992",
  appId: "1:803082075992:web:4dcab532b729a4f439af2d"
};

firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const db = firebase.firestore();
const ALLOWED_UID = "OTmyUmF0F1cNguS4tFdpqHti6Mx1";
const cloudDoc = db.collection('weddingPlan').doc('shared');
let remoteReady=false;
let applyingRemote=false;
let unsubscribeCloud=null;
let initialCloudLoaded=false;
const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({prompt:'select_account'});
fbAuth.useDeviceLanguage();

async function googleLogin(){
  const err=document.getElementById('authError');
  err.textContent='';
  try{
    await fbAuth.signInWithPopup(googleProvider);
  }catch(e){
    console.error(e);
    if(e && e.code==='auth/popup-blocked'){
      err.textContent='팝업이 차단됐어요. Safari 팝업 차단을 잠시 해제하고 다시 시도해 주세요.';
    }else{
      err.textContent='로그인에 실패했어요. '+(e && e.message ? e.message : '');
    }
  }
}
async function logout(){
  await fbAuth.signOut();
}
function copyUid(){
  const uid=document.getElementById('authUid').textContent;
  if(!uid)return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(uid).then(()=>alert('UID를 복사했어요.'));
  }else{
    prompt('아래 UID를 복사해 주세요.',uid);
  }
}
fbAuth.onAuthStateChanged(async user=>{
  const gate=document.getElementById('authGate');
  const app=document.getElementById('appRoot');
  const nav=document.getElementById('appNav');
  const err=document.getElementById('authError');

  if(unsubscribeCloud){unsubscribeCloud();unsubscribeCloud=null}
  remoteReady=false;
  initialCloudLoaded=false;

  if(user){
    if(user.uid!==ALLOWED_UID){
      err.textContent='이 Google 계정은 이 결혼준비 사이트에 접근할 수 없어요.';
      await fbAuth.signOut();
      return;
    }
    document.getElementById('authEmail').textContent=user.email||'Google 계정';
    document.getElementById('authUid').textContent=user.uid;
    gate.style.display='none';
    app.style.display='block';
    nav.style.display='flex';
    setSyncStatus('Firebase 연결 중…');
    await startCloudSync();
  }else{
    gate.style.display='flex';
    app.style.display='none';
    nav.style.display='none';
    setSyncStatus('로그인 필요');
  }
});

const $=id=>document.getElementById(id);
const DEFAULT_SCHEDULE_CATS=['스튜디오','드레스','메이크업','웨딩홀','예복','웨딩밴드','신혼여행','혼주','기본준비','예식준비'];
const DEFAULT_MONEY_CATS=['스드메','웨딩홀','예복','웨딩밴드','신혼여행','혼주','예식준비','가전·가구','기타'];
const K={tasks:'wed_tasks_v1',money:'wed_money_v1',scheduleCats:'wed_categories_v1'};

let tasks=safeParse(localStorage.getItem(K.tasks),[]);
let scheduleCats=safeParse(localStorage.getItem(K.scheduleCats),DEFAULT_SCHEDULE_CATS.slice());
let money=safeParse(localStorage.getItem(K.money),{});
migrateMoney();

let view=new Date(),selected=null,editingTaskId=null,editingAccountId=null,editingExpenseId=null;

function safeParse(s,fallback){try{return s?JSON.parse(s):fallback}catch{return fallback}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function won(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'}
function localDateString(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function jsq(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function persist(){
  localStorage.setItem(K.tasks,JSON.stringify(tasks));
  localStorage.setItem(K.scheduleCats,JSON.stringify(scheduleCats));
  localStorage.setItem(K.money,JSON.stringify(money));
  if(remoteReady && !applyingRemote) saveCloud();
}
function setSyncStatus(msg){
  const el=document.getElementById('syncStatus');
  if(el)el.textContent=msg;
}
function cloudPayload(){
  return {
    tasks: JSON.parse(JSON.stringify(tasks)),
    scheduleCats: JSON.parse(JSON.stringify(scheduleCats)),
    money: JSON.parse(JSON.stringify(money)),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
}
function hasMeaningfulLocalData(){
  const hasTasks=Array.isArray(tasks)&&tasks.length>0;
  const hasExpenses=Array.isArray(money.expenses)&&money.expenses.length>0;
  const hasBudget=Number(money.budget||0)>0;
  const hasCategoryBudget=Object.values(money.categoryBudgets||{}).some(v=>Number(v)>0);
  const hasAccountMoney=(money.accounts||[]).some(a=>Number(a.balance||0)!==0);
  return hasTasks||hasExpenses||hasBudget||hasCategoryBudget||hasAccountMoney;
}
async function saveCloud(){
  try{
    setSyncStatus('저장 중…');
    await cloudDoc.set(cloudPayload());
    setSyncStatus('동기화됨');
  }catch(e){
    console.error('Firestore save error',e);
    setSyncStatus('동기화 오류');
  }
}
function applyCloudData(data){
  applyingRemote=true;
  try{
    tasks=Array.isArray(data.tasks)?data.tasks:[];
    scheduleCats=Array.isArray(data.scheduleCats)&&data.scheduleCats.length?data.scheduleCats:DEFAULT_SCHEDULE_CATS.slice();
    money=data.money&&typeof data.money==='object'?data.money:{};
    migrateMoney();
    localStorage.setItem(K.tasks,JSON.stringify(tasks));
    localStorage.setItem(K.scheduleCats,JSON.stringify(scheduleCats));
    localStorage.setItem(K.money,JSON.stringify(money));
    renderAll();
  }finally{
    applyingRemote=false;
  }
}
async function startCloudSync(){
  try{
    const snap=await cloudDoc.get();

    if(!snap.exists){
      if(hasMeaningfulLocalData()){
        setSyncStatus('기존 데이터 업로드 중…');
        await cloudDoc.set(cloudPayload());
        setSyncStatus('기존 데이터 업로드 완료');
      }else{
        setSyncStatus('클라우드 데이터 대기 중');
      }
    }else{
      applyCloudData(snap.data()||{});
      setSyncStatus('클라우드 데이터 불러옴');
    }

    remoteReady=true;
    initialCloudLoaded=true;

    unsubscribeCloud=cloudDoc.onSnapshot(doc=>{
      if(!doc.exists)return;
      const data=doc.data()||{};
      applyCloudData(data);
      setSyncStatus('동기화됨');
    },e=>{
      console.error('Firestore listen error',e);
      setSyncStatus('동기화 오류');
    });
  }catch(e){
    console.error('Firestore init error',e);
    setSyncStatus('권한/연결 오류');
  }
}

function migrateMoney(){
  money.budget=Number(money.budget||0);
  money.expenses=Array.isArray(money.expenses)?money.expenses:[];
  money.categoryBudgets=money.categoryBudgets||{};
  money.moneyCategories=Array.isArray(money.moneyCategories)&&money.moneyCategories.length?money.moneyCategories.map(x=>typeof x==='string'?{id:id(),name:x}:x):DEFAULT_MONEY_CATS.map(name=>({id:id(),name}));
  if(!Array.isArray(money.accounts)){
    money.accounts=[];
    if(Number(money.saving||0)!==0||Number(money.checking||0)!==0){
      money.accounts.push({id:'legacy-saving',name:'저축통장',balance:Number(money.saving||0)});
      money.accounts.push({id:'legacy-checking',name:'입출금통장',balance:Number(money.checking||0)});
    } else {
      money.accounts.push({id:'legacy-saving',name:'저축통장',balance:0},{id:'legacy-checking',name:'입출금통장',balance:0});
    }
  }
  const catByName=n=>money.moneyCategories.find(c=>c.name===n)?.id||money.moneyCategories.find(c=>c.name==='기타')?.id||money.moneyCategories[0]?.id||'';
  money.expenses=money.expenses.map(e=>{
    let categoryId=e.categoryId||catByName(e.cat||'기타');
    let sourceType=e.sourceType,sourceId=e.sourceId,sourceLabel=e.sourceLabel;
    if(!sourceType){
      if(e.source==='saving'){sourceType='account';sourceId='legacy-saving'}
      else if(e.source==='checking'){sourceType='account';sourceId='legacy-checking'}
      else if(e.source==='partner'){sourceType='partner'}
      else{sourceType='me'}
    }
    return {...e,id:e.id||id(),categoryId,sourceType,sourceId,sourceLabel};
  });
  const newBudgets={};
  for(const [k,v] of Object.entries(money.categoryBudgets)){
    const existing=money.moneyCategories.find(c=>c.id===k);
    const cid=existing?k:catByName(k);
    if(cid)newBudgets[cid]=Number(v||0);
  }
  money.categoryBudgets=newBudgets;
  delete money.saving;delete money.checking;
  persist();
}

function openExpense(){
  if(!money.moneyCategories.length)return alert('먼저 가계부 분류를 하나 추가해 주세요.');
  editingExpenseId=null;$('expenseModalTitle').textContent='결제 추가';$('expenseSaveBtn').textContent='저장';$('eTitle').value='';$('eDate').value=localDateString();$('eAmount').value='';$('eMemo').value='';fillExpenseSelects();$('expenseModal').style.display='flex';
}
function editExpense(eid){
  const e=money.expenses.find(x=>x.id===eid);if(!e)return;editingExpenseId=eid;$('expenseModalTitle').textContent='결제 수정';$('expenseSaveBtn').textContent='수정 저장';$('eTitle').value=e.title;$('eDate').value=e.date;$('eAmount').value=e.amount;$('eMemo').value=e.memo||'';fillExpenseSelects(e.categoryId,e.sourceType,e.sourceId);$('expenseModal').style.display='flex';
}
function restoreAccountForExpense(e){if(e.sourceType==='account'){const a=money.accounts.find(x=>x.id===e.sourceId);if(a)a.balance+=Number(e.amount||0)}}
function applyAccountForExpense(e){
  if(e.sourceType!=='account')return true;const a=money.accounts.find(x=>x.id===e.sourceId);if(!a)return false;
  if(a.balance<e.amount&&!confirm(`${a.name} 잔액보다 큰 결제입니다. 그래도 저장할까요?`))return false;a.balance-=e.amount;return true;
}
function saveExpense(){
  const title=$('eTitle').value.trim(),date=$('eDate').value,amount=Number($('eAmount').value);if(!title||!date||!(amount>0))return alert('항목명, 날짜, 금액을 입력해 주세요.');
  const sv=$('eSource').value,sourceType=sv.startsWith('account:')?'account':sv,sourceId=sourceType==='account'?sv.split(':')[1]:'';
  const data={title,categoryId:$('eCat').value,date,amount,sourceType,sourceId,memo:$('eMemo').value};
  const old=editingExpenseId?money.expenses.find(x=>x.id===editingExpenseId):null;
  if(old)restoreAccountForExpense(old);
  if(!applyAccountForExpense(data)){if(old)applyAccountForExpense(old);return}
  if(old)Object.assign(old,data);else money.expenses.push({id:id(),...data});
  editingExpenseId=null;persist();closeM('expenseModal');renderMoney();
}
function deleteExpense(eid){
  const e=money.expenses.find(x=>x.id===eid);if(!e)return;if(confirm('이 결제내역을 삭제할까요?\n공동통장 결제였다면 해당 금액이 통장 잔액으로 다시 돌아갑니다.')){restoreAccountForExpense(e);money.expenses=money.expenses.filter(x=>x.id!==eid);persist();renderMoney()}
}
function editTotalBudget(){const v=prompt('총 결혼 예산을 입력해 주세요.',money.budget||0);if(v===null)return;const n=Number(String(v).replace(/,/g,''));if(!Number.isFinite(n)||n<0)return alert('금액을 숫자로 입력해 주세요.');money.budget=n;persist();renderMoney()}
function renderMoney(){
  const spent=totalSpent(),rem=money.budget-spent;$('budgetTotal').textContent=won(money.budget);$('spent').textContent=won(spent);$('remaining').textContent=won(rem);$('budgetBar').style.width=(money.budget?Math.min(100,spent/money.budget*100):0)+'%';
  renderBudgetCategories();renderAccounts();renderExpenses();if($('allExpensePanel')&&$('allExpensePanel').style.display!=='none')renderAllExpenses();
}
function renderAll(){renderCal();renderOngoing();renderMonths();renderMoney();renderScheduleCats()}
renderAll();
</script>
</body>
</html>
